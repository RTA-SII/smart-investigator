# Lint, test and build on every push.
#
# Deployment is handled by Netlify, which builds from this repository on its
# own — there is no GitHub Pages job, because Pages puts the account name in
# the URL and this demo is addressed by its project name instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19 || >=22.12, so 20 sits on the boundary and
          # depends on which 20.x the runner resolves. 22 is unambiguous.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
