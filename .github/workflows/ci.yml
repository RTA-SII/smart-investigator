# Lint, test and build on every push, then publish to GitHub Pages.
#
# The deploy job needs Pages switched on with the Actions source:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# Without it the build still runs but the deploy step fails.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19 || >=22.12, so 20 sits on the boundary and
          # depends on which 20.x the runner resolves. 22 is unambiguous —
          # the first CI run failed on 20 for exactly this reason.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
