# Netlify serves the site from the root of its own hostname, which is why
# `base` in vite.config.js is "/" rather than a repository sub-path.
#
# The app uses a hash router, so deep links resolve client-side and no SPA
# redirect rule is needed.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  # Vite 8 requires ^20.19 || >=22.12. Pinning 22 keeps the deploy on the
  # same footing as CI, which failed on Node 20 for exactly this reason.
  NODE_VERSION = "22"
